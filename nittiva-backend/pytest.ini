[pytest]
DJANGO_SETTINGS_MODULE = nittiva_backend.settings.development
python_files = tests.py test_*.py *_tests.py
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=api
    --cov-report=term-missing
    --cov-report=html:htmlcov
testpaths = api/tests
filterwarnings =
    ignore::DeprecationWarning
