services:
  - type: web
    name: nittiva-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && python manage.py seed_data && gunicorn nittiva_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nittiva.vercel.app,https://*.vercel.app"
      # Postgres (preferred DB). The settings/base.py code reads
      # POSTGRES_HOST/POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD and switches
      # the DATABASES engine to postgresql when POSTGRES_HOST is set.
      # Linked from the postgres service at the bottom of this file.
      - key: POSTGRES_DB
        fromDatabase:
          name: nittiva-db
          property: databaseName
      - key: POSTGRES_USER
        fromDatabase:
          name: nittiva-db
          property: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: nittiva-db
          property: password
      - key: POSTGRES_HOST
        fromService:
          type: pserv
          name: nittiva-db
          property: host
      - key: POSTGRES_PORT
        fromService:
          type: pserv
          name: nittiva-db
          property: port
      # Email (optional — leave SMTP creds blank to log to console; set them in
      # the Render dashboard to enable real email delivery for password reset / invites)
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@nittiva.com"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""

# Postgres (free plan, 1GB, expires after 90 days on free plan).
# The web service above pulls the connection details from this DB and
# passes them to Django via POSTGRES_* env vars. settings/base.py detects
# POSTGRES_HOST and switches from SQLite to Postgres automatically.
databases:
  - name: nittiva-db
    databaseName: nittiva
    user: nittiva
    plan: free
    ipAllowList: []
