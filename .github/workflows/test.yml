name: tests

# Run the pytest suite on every push to main + on every PR.
# See api/tests/ for the test files; conftest.py for fixtures.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd nittiva-backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'github-actions-test-secret-key-not-for-prod' }}
          DJANGO_SETTINGS_MODULE: nittiva_backend.settings.development
        run: |
          cd nittiva-backend
          pytest -q --no-cov

      - name: Upload coverage report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: nittiva-backend/htmlcov/
          if-no-files-found: ignore
